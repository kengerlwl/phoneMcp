name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: phone-mcp-linux-amd64
            asset_name: phone-mcp-linux-amd64
            skill_zip_name: phone-mcp-skill-linux-amd64.zip
            binary_in_skill: phone-mcp
            adb_url: https://dl.google.com/android/repository/platform-tools-latest-linux.zip
          - os: windows-latest
            artifact_name: phone-mcp.exe
            asset_name: phone-mcp-windows-amd64.exe
            skill_zip_name: phone-mcp-skill-windows-amd64.zip
            binary_in_skill: phone-mcp.exe
            adb_url: https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          - os: macos-latest
            artifact_name: phone-mcp-macos-arm64
            asset_name: phone-mcp-macos-arm64
            skill_zip_name: phone-mcp-skill-macos-arm64.zip
            binary_in_skill: phone-mcp
            adb_url: https://dl.google.com/android/repository/platform-tools-latest-darwin.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller typer

      - name: Download ADB platform-tools
        shell: bash
        run: |
          curl -L -o platform-tools.zip "${{ matrix.adb_url }}"
          unzip -q platform-tools.zip
          echo "[CI] Downloaded ADB platform-tools:"
          ls -la platform-tools/

      - name: Build executable (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m PyInstaller --onefile --name phone-mcp-linux-amd64 --clean --noconfirm \
            --collect-all fastmcp --collect-all mcp --collect-all phone_mcp --collect-all rich --collect-all lupa --collect-all fakeredis \
            --exclude-module mcp.cli --exclude-module typer \
            --add-data "platform-tools:platform-tools" \
            --hidden-import uvicorn --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on --hidden-import starlette \
            --hidden-import anyio --hidden-import httpx --hidden-import pydantic \
            --hidden-import httpcore --hidden-import h11 \
            --hidden-import PIL --hidden-import PIL.Image \
            main.py

      - name: Build executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          python -m PyInstaller --onefile --name phone-mcp --clean --noconfirm `
            --collect-all fastmcp --collect-all mcp --collect-all phone_mcp --collect-all rich --collect-all lupa --collect-all fakeredis `
            --exclude-module mcp.cli --exclude-module typer `
            --add-data "platform-tools;platform-tools" `
            --hidden-import uvicorn --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on --hidden-import starlette `
            --hidden-import anyio --hidden-import httpx --hidden-import pydantic `
            --hidden-import httpcore --hidden-import h11 `
            --hidden-import PIL --hidden-import PIL.Image `
            main.py

      - name: Build executable (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          python -m PyInstaller --onefile --name phone-mcp-macos-arm64 --clean --noconfirm \
            --collect-all fastmcp --collect-all mcp --collect-all phone_mcp --collect-all rich --collect-all lupa --collect-all fakeredis \
            --exclude-module mcp.cli --exclude-module typer \
            --add-data "platform-tools:platform-tools" \
            --hidden-import uvicorn --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on --hidden-import starlette \
            --hidden-import anyio --hidden-import httpx --hidden-import pydantic \
            --hidden-import httpcore --hidden-import h11 \
            --hidden-import PIL --hidden-import PIL.Image \
            main.py

      - name: Rename Windows artifact
        if: matrix.os == 'windows-latest'
        run: |
          Move-Item dist/phone-mcp.exe dist/phone-mcp-windows-amd64.exe

      - name: Upload standalone binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      # --- Package Skill zip (binary + SKILL.md) ---
      - name: Package Skill zip (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p skill-package
          cp dist/${{ matrix.asset_name }} skill-package/${{ matrix.binary_in_skill }}
          chmod +x skill-package/${{ matrix.binary_in_skill }}
          cp SKILL.md skill-package/SKILL.md
          cd skill-package
          zip -r ../${{ matrix.skill_zip_name }} .
          cd ..
          echo "[CI] Skill package contents:"
          unzip -l ${{ matrix.skill_zip_name }}

      - name: Package Skill zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path skill-package
          Copy-Item "dist/${{ matrix.asset_name }}" "skill-package/${{ matrix.binary_in_skill }}"
          Copy-Item "SKILL.md" "skill-package/SKILL.md"
          Compress-Archive -Path "skill-package/*" -DestinationPath "${{ matrix.skill_zip_name }}"
          Write-Host "[CI] Skill package created: ${{ matrix.skill_zip_name }}"

      - name: Upload Skill zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.skill_zip_name }}
          path: ${{ matrix.skill_zip_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: PhoneMCP ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## PhoneMCP ${{ steps.get_version.outputs.VERSION }}

            Android 设备控制工具 - 通过 ADB 远程控制 Android 设备

            ### 🎉 开箱即用

            本版本**内嵌了 ADB**，无需预先安装 ADB 即可直接使用！

            ---

            ### 📦 方式一：Skill 模式（⭐ 推荐，零配置）

            下载对应平台的 **Skill 压缩包**，解压到 Skill 目录即可：

            | 平台 | 下载 | 解压到 |
            |------|------|--------|
            | 🍎 macOS | `phone-mcp-skill-macos-arm64.zip` | `~/.catpaw/skills/phone-mcp/` |
            | 🐧 Linux | `phone-mcp-skill-linux-amd64.zip` | `~/.catpaw/skills/phone-mcp/` |
            | 🪟 Windows | `phone-mcp-skill-windows-amd64.zip` | `%USERPROFILE%\.catpaw\skills\phone-mcp\` |

            解压后目录结构：
            ```
            phone-mcp/
            ├── SKILL.md      # AI 操作指南（AI 自动读取）
            └── phone-mcp     # 可执行文件
            ```

            AI 会自动识别并使用这个 Skill 来操控你的手机，无需任何配置。

            **CLI 用法示例：**
            ```bash
            ./phone-mcp run '{"action":"screenshot"}'
            ./phone-mcp run '{"action":"tap_element","text":"微信"}'
            ./phone-mcp run '{"action":"list_devices"}'
            ```

            ---

            ### 🔧 方式二：MCP 服务器模式（需要配置）

            下载单独的可执行文件，启动 MCP 服务器：

            | 平台 | 文件 |
            |------|------|
            | 🐧 Linux | `phone-mcp-linux-amd64` |
            | 🪟 Windows | `phone-mcp-windows-amd64.exe` |
            | 🍎 macOS | `phone-mcp-macos-arm64` |

            ```bash
            # 启动 MCP 服务器
            ./phone-mcp-macos-arm64 serve

            # 或指定端口
            ./phone-mcp-macos-arm64 serve --port 8080

            # STDIO 模式
            ./phone-mcp-macos-arm64 serve --transport stdio
            ```

            MCP 客户端配置：
            ```json
            {
              "mcpServers": {
                "phone-mcp": {
                  "url": "http://localhost:8009/Phone/sse"
                }
              }
            }
            ```

            ---

            ### 前置要求
            - Android 设备已连接（USB 或 WiFi）
            - 设备已开启 USB 调试
          files: |
            artifacts/phone-mcp-linux-amd64/phone-mcp-linux-amd64
            artifacts/phone-mcp-windows-amd64.exe/phone-mcp-windows-amd64.exe
            artifacts/phone-mcp-macos-arm64/phone-mcp-macos-arm64
            artifacts/phone-mcp-skill-linux-amd64.zip/phone-mcp-skill-linux-amd64.zip
            artifacts/phone-mcp-skill-windows-amd64.zip/phone-mcp-skill-windows-amd64.zip
            artifacts/phone-mcp-skill-macos-arm64.zip/phone-mcp-skill-macos-arm64.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

